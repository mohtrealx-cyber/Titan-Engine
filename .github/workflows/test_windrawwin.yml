name: Titan Engine Pipeline

on:
  workflow_dispatch: # Allows you to trigger the run manually from the Actions tab

jobs:
  scrape-and-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 lxml google-generativeai

      - name: Run Titan Engine Script
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test_windrawwin.py
