name: Quant Engine Automation

on:
  schedule:
    # Runs at 03:00 UTC (06:00 EAT) every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests beautifulsoup4 google-generativeai fuzzywuzzy python-Levenshtein

      - name: Run Quant Engine Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python quant_engine.py

      - name: Commit Memory File (pending_tickets.json)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pending_tickets.json || echo "No changes to add"
          git commit -m "Auto-update pending tickets memory" || echo "No changes to commit"
          git push
