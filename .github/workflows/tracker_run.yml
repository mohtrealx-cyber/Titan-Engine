name: Titan Engine - Line Tracker

on:
  schedule:
    # Runs at 05:55 UTC (10 minutes after matrix_run.yml)
    - cron: '55 5 * * *'
  workflow_dispatch: 

jobs:
  run-titan-variant:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Titan Line Tracker
        env:
          # Using isolated secret parameters for the tracker channel
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python tracker_engine.py
