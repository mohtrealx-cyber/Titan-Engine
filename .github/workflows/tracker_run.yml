name: Line Movement Tracker Automator

on:
  schedule:
    - cron: '0 */3 * * *' # Automated check executes every 3 hours on the dot
  workflow_dispatch: # Permits instant manual execution overrides

jobs:
  track-market:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository state
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inject Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Market Scanning Engine
        env:
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python tracker_engine.py

      - name: Commit Market State Tracking Changes
        run: |
          git config --global user.name "Market-Tracker-Bot"
          git config --global user.email "tracker@github.com"
          git add odds_baseline_tracker.csv
          git commit -m "Automated update of opening odds baseline profiles [skip ci]" || exit 0
          git push
