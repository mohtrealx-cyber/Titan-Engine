name: Titan Line Tracker Automation

on:
  schedule:
    # This runs at 6:00 AM and 4:00 PM (EAT) every day
    - cron: '0 3,13 * * *' 
  workflow_dispatch: # Keeps your manual run button

jobs:
  run-line-tracker:
    runs-on: ubuntu-latest

    # Grants write access to push the memory file back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Titan Line Tracker Engine
        env:
          TRACKER_TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TRACKER_TELEGRAM_CHAT_ID }}
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python tracker_engine.py

      - name: Commit Tracker Memory Back to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Titan Line Tracker Automator"
          git add pending_tracker_tickets.json
          # Skips running actions recursively if a commit is pushed, and handles empty saves gracefully
          git commit -m "Auto-update Line Tracker memory notebook [skip ci]" || echo "No new tracker selections to save"
          git push
