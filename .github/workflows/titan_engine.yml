name: Quant Engine Automation (Bot A)

on:
  schedule:
    # 02:00 UTC = 05:00 EAT (Runs exactly 30 mins before Bot B)
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force Run (Bypass 05:00 EAT lock & Rescrape)'
        required: false
        type: boolean
        default: false

concurrency:
  group: engine
  cancel-in-progress: true

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      # ============================================================
      # 1. CHECKOUT CURRENT MAIN BRANCH
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. SET UP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo ""
          echo "✅ Dependencies installed successfully"

      # ============================================================
      # 4. RUN QUANT ENGINE (BOT A)
      # ============================================================
      - name: Run Quant Engine
        env:
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}

          QUANT_TELEGRAM_TOKEN: ${{ secrets.QUANT_TELEGRAM_TOKEN }}
          QUANT_TELEGRAM_CHAT_ID: ${{ secrets.QUANT_TELEGRAM_CHAT_ID }}

          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # NEW: GIST SECRETS FOR BOT-TO-BOT SYNC INJECTED HERE
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

          FORCE_RUN: ${{ inputs.force_run }}

        run: |
          echo "=========================================="
          echo "STARTING QUANT ENGINE"
          echo "=========================================="

          python quant_engine.py

      # ============================================================
      # 5. SAVE MEMORY FILE
      # ============================================================
      - name: Commit Memory File Back to GitHub
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Titan Automator"

          git add pending_tickets.json || true

          git commit \
            -m "Auto-update memory notebook with today's matches" \
            || echo "No new matches to save"

          git pull --rebase origin main || true

          git push origin main || true
