name: Titan Engine Pipeline

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 8 * * *' 

# Required to allow GitHub Actions to commit files back to your repo
permissions:
  contents: write

jobs:
  scrape-and-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml google-genai

      - name: Run WinDrawWin Scraper
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test_windrawwin.py

      # --- Add future scrapers here ---
      # - name: Run Forebet Scraper
      #   run: python test_forebet.py
      # --------------------------------

      - name: Run Titan Aggregator
        run: python aggregate_predictions.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update consensus for $(date +'%Y-%m-%d')"
          git push
