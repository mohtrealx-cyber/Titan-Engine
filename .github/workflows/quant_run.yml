name: Quant Engine Automation

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC (11:00 AM EAT)
  workflow_dispatch: # Allows manual trigger for checking settled matches

jobs:
  run-titan-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit memory files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Titan Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python quant_engine.py

      - name: Save Memory State (Always Run)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_tickets.json lock_state.json || true
          git commit -m "auto: update settled tickets and lock state" || echo "No changes to commit"
          git push origin HEAD:main
