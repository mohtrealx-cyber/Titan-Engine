name: Quant Engine Automation

on:
  schedule:
    # Runs at 08:00 EAT (05:00 UTC) and 14:00 EAT (11:00 UTC)
    - cron: '0 5,11 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bs4 curl_cffi

      - name: Run Quant Engine
        env:
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}
          QUANT_TELEGRAM_TOKEN: ${{ secrets.QUANT_TELEGRAM_TOKEN }}
          QUANT_TELEGRAM_CHAT_ID: ${{ secrets.QUANT_TELEGRAM_CHAT_ID }}
          ZEN_PROXY_KEY: ${{ secrets.ZEN_PROXY_KEY }}
        run: python quant_engine.py
