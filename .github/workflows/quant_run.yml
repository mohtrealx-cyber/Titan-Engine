name: Titan Consensus Engine

on:
schedule:
# Runs at 6:00 AM East African Time (03:00 UTC) every day
- cron: '0 3 * * *'
workflow_dispatch: # Allows you to manually trigger the bot from the GitHub Actions tab

jobs:
run-engine:
runs-on: ubuntu-latest

steps:
  # STREAMING_CHUNK:Checkout the code repository
  - name: Checkout Repository
    uses: actions/checkout@v4

  # STREAMING_CHUNK:Set up the Python environment
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  # STREAMING_CHUNK:Install required Python packages
  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 curl_cffi

  # STREAMING_CHUNK:Execute the Titan Engine script with secure environment variables
  - name: Run Titan Engine
    env:
      # Pulling your secure keys from GitHub Secrets
      TRACKER_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
    run: python quant_engine.py

  # STREAMING_CHUNK:Commit and push any updated tickets memory back to the repository
  - name: Save Ticket Memory (Commit changes)
    run: |
      git config --local user.email "action@github.com"
      git config --local user.name "GitHub Action"
      git add pending_tickets.json || true
      git commit -m "Auto-update pending tickets memory" || true
      git push || true
