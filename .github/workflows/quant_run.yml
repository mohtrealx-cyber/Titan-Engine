name: Quant Engine Automation

on:
  schedule:
    # 2:45 AM UTC (5:45 AM EAT). Bypasses the top-of-the-hour GitHub traffic jam.
    - cron: '45 2 * * *'
  workflow_dispatch:

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # Includes the required Gemini API and BeautifulSoup libraries
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi requests google-generativeai

      - name: Run Quant Engine
        env:
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}
          QUANT_TELEGRAM_TOKEN: ${{ secrets.QUANT_TELEGRAM_TOKEN }}
          QUANT_TELEGRAM_CHAT_ID: ${{ secrets.QUANT_TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python quant_engine.py

      - name: Commit Memory File Back to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Titan Automator"
          git add pending_tickets.json || true
          git commit -m "Auto-update memory notebook with today's locked matches" || echo "No new matches to save today"
          git push || true
