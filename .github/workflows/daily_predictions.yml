name: Daily Match Predictor

on:
  schedule:
    # Runs automatically every day at 08:00 AM UTC
    - cron: '0 8 * * *' 
  workflow_dispatch: # Gives you a manual 'Run workflow' button to test it anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Execute Prediction Script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MATCH_BOT_TOKEN: ${{ secrets.MATCH_BOT_TOKEN }}
          MATCH_CHANNEL_ID: ${{ secrets.MATCH_CHANNEL_ID }}
        run: python predict.py
