name: Daily Match Predictor

on:
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          # Upgraded to 3.11 to prevent API core warnings
          python-version: '3.11'

      - name: Install Required Packages
        run: |
          python -m pip install --upgrade pip
          # Swapped out the deprecated package for the new one
          pip install requests google-genai

      - name: Execute Prediction Script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MATCH_BOT_TOKEN: ${{ secrets.MATCH_BOT_TOKEN }}
          MATCH_CHANNEL_ID: ${{ secrets.MATCH_CHANNEL_ID }}
        run: python predict.py
