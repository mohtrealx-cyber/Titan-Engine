name: Fortress V2 Algorithmic Engine

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: 

jobs:
  run-fortress:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install understatapi requests

      - name: Execute Algorithmic Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xg_scraper_test.py
