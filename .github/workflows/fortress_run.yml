name: Titan LLM Fortress Engine Automator

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  run-fortress-llm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 curl_cffi google-generativeai
          
      - name: Execute LLM Fortress Core
        env:
          # Pulling from your brand new V2 secrets!
          TELEGRAM_TOKEN: ${{ secrets.TITAN_BOT_TOKEN_V2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TITAN_CHAT_ID_V2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: python fortress_engine.py
