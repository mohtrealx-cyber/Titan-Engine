name: Titan LLM Fortress Engine Automator

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  run-fortress-llm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bs4 curl_cffi google-generativeai
          
      - name: Execute LLM Fortress Core
        env:
          # 🔴 CRITICAL FIX: Direct injection of your new Telegram Bot credentials
          TELEGRAM_TOKEN: "8970975457:AAEoqpJzuBIrYz672f71FvCWC3sEzLacRik"
          TELEGRAM_CHAT_ID: "5876539862"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: python fortress_engine.py
