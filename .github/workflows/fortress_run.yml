name: Fortress V2 Algorithmic Engine

on:
  schedule:
    - cron: '17 4 * * *'  # 7:17 AM East African Time
    - cron: '17 10 * * *' # 1:17 PM East African Time
  workflow_dispatch:

permissions:
  contents: write  # Gives the bot permission to save the CSV permanently

jobs:
  run-fortress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python Runtime
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Data Ingestion Libraries
        run: pip install beautifulsoup4 curl-cffi

      - name: Execute Algorithmic Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.FORTRESS_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.FORTRESS_TELEGRAM_CHAT_ID }}
        run: python fortress_engine.py

      - name: Save CSV Data Back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fortress_performance_history.csv
          git commit -m "Auto-update performance history [Bot]" || echo "No changes to commit"
          git push
